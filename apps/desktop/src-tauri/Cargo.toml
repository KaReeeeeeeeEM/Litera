[package]
name = "litera-desktop"
version = "0.1.3"
description = "Litera accessible publishing workspace"
authors = ["Litera Team"]
edition = "2021"

[lib]
name = "litera_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
