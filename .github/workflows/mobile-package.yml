name: Mobile package

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing GitHub release tag that receives the Android APK
        required: true
        default: desktop-v0.1.1

permissions:
  contents: write

env:
  LITERA_APP_URL: https://litera.almareem.com

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri android init --ci
      - run: pnpm --dir apps/desktop tauri android build --debug --apk --target aarch64 --ci
      - name: Prepare Android package
        run: |
          apk=$(find apps/desktop/src-tauri/gen/android -type f -name '*.apk' | head -n 1)
          test -n "$apk"
          cp "$apk" Litera_0.1.1_android-aarch64.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Litera-Android
          path: Litera_0.1.1_android-aarch64.apk
      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" Litera_0.1.1_android-aarch64.apk --clobber

  ios-simulator:
    name: iOS simulator validation
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios-sim
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/desktop tauri ios init --ci
      - run: pnpm --dir apps/desktop tauri ios build --debug --target aarch64-sim --no-sign
      - name: Package simulator application
        run: |
          app=$(find apps/desktop/src-tauri/gen/apple -type d -name '*.app' | head -n 1)
          test -n "$app"
          ditto -c -k --sequesterRsrc --keepParent "$app" Litera_0.1.1_ios-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Litera-iOS-Simulator
          path: Litera_0.1.1_ios-simulator.zip
