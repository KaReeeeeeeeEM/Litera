name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Require the deployed workspace URL
        shell: bash
        env:
          LITERA_APP_URL: ${{ vars.LITERA_APP_URL }}
        run: test -n "$LITERA_APP_URL" && [[ "$LITERA_APP_URL" == https://* ]]
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITERA_APP_URL: ${{ vars.LITERA_APP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Litera Desktop v__VERSION__
          releaseBody: |
            Litera Desktop __VERSION__ is a signed cross-platform release for accessible educational publishing.

            ## Highlights
            - Storyboarding now preserves closed table borders, source-aligned rows and columns, consistent number sizing, cell padding, and source color systems
            - Illustration tables keep complete images within their cells, preserve source alignment, and avoid hanging or duplicated rules
            - Exercise continuations are grouped across pages and launch as complete, accessible activity views with answer checking
            - Tracing, matching, counting, selection, and written-response activities receive activity-specific interactive controls
            - Source text deduplication prevents repeated titles and narration while preserving chronological page reading order
            - Reader highlighting is synchronized to spoken words and images, with cleaner captions and fewer repeated speech segments
            - Rerendering is page-scoped, bounded, cancellable, and audits missing visuals without freezing the rest of the storyboard
            - Preview, release notes, image editing, and Windows layouts include responsiveness and usability refinements
            - Regression coverage now includes structural tables, figure grids, multi-page activities, speech order, language handling, and delivery flows

            ## Upgrade
            Existing Litera Desktop installations can open **Updates** and choose **Check for updates**. New installations can download the matching macOS, Windows, Linux, or universal Android package from this release.

            See the release assets below for installers and `latest.json` for verified in-app updates. The iOS build is validated in the simulator; installation on physical Apple devices requires Apple Developer signing.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
