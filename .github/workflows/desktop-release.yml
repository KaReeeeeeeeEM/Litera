name: Desktop release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils
      - run: pnpm install --frozen-lockfile
      - name: Require the deployed workspace URL
        shell: bash
        env:
          LITERA_APP_URL: ${{ vars.LITERA_APP_URL }}
        run: test -n "$LITERA_APP_URL" && [[ "$LITERA_APP_URL" == https://* ]]
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LITERA_APP_URL: ${{ vars.LITERA_APP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: desktop-v__VERSION__
          releaseName: Litera Desktop v__VERSION__
          releaseBody: |
            Litera Desktop __VERSION__ is a signed cross-platform release for accessible educational publishing.

            ## Highlights
            - Fast deterministic single-page re-rendering with AI fallback instead of stalled or invalid responses
            - Lower-memory Storyboard scheduling and batched persistence for smoother conversion on modest computers
            - Resilient book-language image captions with a usable description for every extracted figure
            - Recovered continuous multi-page tables of contents with digital destinations and clean leader handling
            - Compact accessible image-caption cards with readable page badges
            - Full-width fixed reader dock matching the established page, contents, speech, language, and settings layout

            ## Upgrade
            Existing Litera Desktop installations can open **Updates** and choose **Check for updates**. New installations can download the matching macOS, Windows, Linux, or universal Android package from this release.

            See the release assets below for installers and `latest.json` for verified in-app updates. The iOS build is validated in the simulator; installation on physical Apple devices requires Apple Developer signing.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
